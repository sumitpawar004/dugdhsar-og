name: Continuous Quality Assurance & Production Smoke Monitor

on:
  pull_request:
    branches: [main, master]
  schedule:
    # Run production smoke checks every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  pull-request-qa:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Full Autonomous QA Suite
        run: npm run qa

  production-smoke-monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Live Production Smoke Checks
        env:
          SMOKE_URL: https://dugdhsar.in
        run: npx tsx scripts/smoke-test.ts

      - name: Open GitHub Issue on Smoke Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Production Smoke Test Failure Alert',
              body: `Automated production smoke test against https://dugdhsar.in failed at ${new Date().toISOString()}.\n\nPlease inspect the run logs immediately: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'production-incident', 'p0']
            });
